# Publica o app no GitHub Pages a cada envio para a branch main.
# Endereço: https://ghsantosalves.github.io/mesa-de-fichas/
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      # Plugin do Zotero, baixável em .../mesa-de-fichas/mesa-de-fichas.xpi
      - name: Empacotar o plugin do Zotero
        run: cd zotero-plugin && zip -r -X ../dist/mesa-de-fichas.xpi manifest.json bootstrap.js locale
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
