<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cordatril: varal em círculo com cinco fichas presas nele (a posição sugere uma estrela)
       e um C no centro, em estilo de xilogravura de cordel. Preto e branco. -->
  <!-- Moldura entalhada -->
  <rect width="64" height="64" rx="12" fill="#111"/>
  <rect x="2.7" y="2.7" width="58.6" height="58.6" rx="10" fill="none" stroke="#fff" stroke-width="0.9" stroke-dasharray="1.6 2.8"/>
  <path d="M6 7.5 Q18 5.2 32 6.2 T58 6.8 Q59.2 20 57.9 32 T58.2 57.6 Q45 59.3 32 57.9 T6.4 58 Q4.9 45 6.1 32 T6 7.5 Z" fill="#fff"/>
  <!-- Varal -->
  <circle cx="32" cy="33" r="17" fill="none" stroke="#111" stroke-width="3.4"/>
  <circle cx="32" cy="33" r="17" fill="none" stroke="#fff" stroke-width="0.7" stroke-dasharray="2 3.5"/>
  <!-- Fichas (brancas, contorno grosso, linhas de texto entalhadas) -->
  <g stroke="#111" stroke-width="2.4" stroke-linejoin="round">
    <rect x="26" y="11" width="12" height="10" fill="#fff" transform="rotate(-3 32 16)"/>
    <rect x="43.7" y="21.2" width="9" height="13" fill="#fff" transform="rotate(4 48.2 27.7)"/>
    <rect x="36.2" y="41.8" width="11.6" height="10" fill="#fff" transform="rotate(-4 42 46.8)"/>
    <rect x="16.2" y="41.8" width="11.6" height="10" fill="#fff" transform="rotate(5 22 46.8)"/>
    <rect x="11.3" y="21.2" width="9" height="13" fill="#fff" transform="rotate(-4 15.8 27.7)"/>
  </g>
  <g stroke="#111" stroke-width="1.3" stroke-linecap="round">
    <path d="M29 14.6 h6 M29 17.4 h4" transform="rotate(-3 32 16)"/>
    <path d="M46.2 24.5 h4 M46.2 27.5 h4 M46.2 30.5 h2.6" transform="rotate(4 48.2 27.7)"/>
    <path d="M39 45.3 h6 M39 48.1 h4" transform="rotate(-4 42 46.8)"/>
    <path d="M19 45.3 h6 M19 48.1 h4" transform="rotate(5 22 46.8)"/>
    <path d="M13.8 24.5 h4 M13.8 27.5 h4 M13.8 30.5 h2.6" transform="rotate(-4 15.8 27.7)"/>
  </g>
  <!-- C angular, como as letras dos folhetos -->
  <g transform="translate(0.9 -1.1) rotate(-6 31.6 34.1)">
    <path d="M38 27 L29 26.6 L25 30.6 L25.4 38 L29.4 41.6 L38.2 41.2 L37.6 37.4 L31 37.6 L29.6 36.2 L29.4 32 L30.8 30.6 L37.4 30.8 Z" fill="#111"/>
    <path d="M27.2 31.4 L27.4 36.8" stroke="#fff" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
